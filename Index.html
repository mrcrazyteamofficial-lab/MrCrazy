<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Crazy DevStudio</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCSawO5etjRhGMhvxgWrlgDp05CpBa45Ak",
      authDomain: "hafizsweets-b651d.firebaseapp.com",
      databaseURL: "https://hafizsweets-b651d-default-rtdb.firebaseio.com",
      projectId: "hafizsweets-b651d",
      storageBucket: "hafizsweets-b651d.firebasestorage.app",
      messagingSenderId: "133545092114",
      appId: "1:133545092114:web:xxxxxxxxxxxxxxxxxxxxxx"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.db = db;
    window.ref = ref;
    window.push = push;
    window.onValue = onValue;
    window.set = set;
    window.update = update;
  </script>

  <style>
    :root {
      --bg: #f9fbfd;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #111827;
      --muted: #64748b;
      --primary: #6d28d9;
      --primary-dark: #5b21b6;
      --gold: #d97706;
      --radius: 16px;
      --shadow-sm: 0 6px 20px rgba(109,40,217,0.08);
      --shadow-md: 0 12px 40px rgba(109,40,217,0.15);
      --glow: 0 0 25px rgba(109,40,217,0.2);
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 2.2rem 1rem 1.6rem; /* thora chota header mobile ke liye */
    }

    .logo-circle {
      width: 88px; /* thora chota */
      height: 88px;
      margin: 0 auto 0.5rem; /* thora oper kiya (margin kam) */
      border-radius: 50%;
      overflow: hidden;
      box-shadow: var(--shadow-md), var(--glow);
      background: linear-gradient(135deg, var(--primary), #a78bfa);
    }

    .logo-circle img { width:100%; height:100%; object-fit:cover; }

    .brand-container {
      background: var(--card);
      padding: 1rem 1.4rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      max-width: 88%;
      margin: 0 auto 1rem;
      text-align: center;
      border: 1px solid var(--border);
    }

    .brand-main {
      font-family: 'Poppins';
      font-size: 1.65rem; /* thora chota */
      font-weight: 800;
      background: linear-gradient(to right, var(--primary), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.2rem;
    }

    .brand-sub {
      font-size: 0.98rem; /* thora chota */
      color: var(--muted);
      font-weight: 500;
    }

   .banner-frame {
  max-width: 100%;
  height: 150px; /* same size */
  margin: 1rem auto;
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;

  /* Fancy gradient border effect */
  border: 3px solid transparent;
  background: linear-gradient(#fff, #fff) padding-box,
              linear-gradient(135deg, #6a11cb, #2575fc, #ff6ec4) border-box;

  /* Soft glow + shadow */
  box-shadow: 0 8px 20px rgba(0,0,0,0.15),
              0 0 15px rgba(100, 150, 255, 0.4);

  /* Smooth animation */
  animation: glowMove 4s linear infinite;
}

/* Animated gradient glow */
@keyframes glowMove {
  0% {
    box-shadow: 0 0 10px rgba(100,150,255,0.3);
  }
  50% {
    box-shadow: 0 0 25px rgba(255,110,196,0.6);
  }
  100% {
    box-shadow: 0 0 10px rgba(100,150,255,0.3);
  }
}

/* Optional inner shine overlay */
.banner-frame::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.4),
    transparent
  );
  opacity: 0;
  transition: 0.5s;
}

/* Hover pe shine effect */
.banner-frame:hover::before {
  opacity: 1;
  animation: shine 1.5s linear;
}

@keyframes shine {
  from {
    transform: translateX(-100%);
  }
  to {
    transform: translateX(100%);
  }
}

    .banner-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .main-buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.95rem; /* thora tight */
      padding: 0 1.1rem 2rem;
    }

    .main-btn {
      width: 100%;
      max-width: 255px; /* thora chota */
      padding: 0.9rem 1.6rem; /* professional floppy (pill) style, size small */
      font-size: 1.07rem;
      font-weight: 700;
      border-radius: 60px;
      cursor: pointer;
      transition: all 0.35s ease;
      border: none;
      box-shadow: var(--shadow-sm);
      color: white;
    }

    .my-apps-btn { background: linear-gradient(135deg, var(--primary), #a78bfa); }
    .report-btn { background: linear-gradient(135deg, #4b5563, #374151); }

    .main-btn:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: var(--shadow-md), var(--glow);
    }

    #apps-page, #detail-page, #report-page {
      display: none;
      padding: 1.2rem;
    }

    .back-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.8rem 1.6rem;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 1.8rem;
      box-shadow: var(--shadow-sm);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    @media (max-width: 480px) { .grid { grid-template-columns: repeat(2, 1fr); } }

    .app-card {
      background: var(--card);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: all 0.4s ease;
      border: 1px solid rgba(94,53,177,0.08);
    }

    .app-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-md), var(--glow);
      border-color: var(--primary);
    }

    .app-icon {
      height: 120px;
      background: linear-gradient(135deg, #f0f4ff, #e8ecff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .app-icon img {
      max-width: 85%;
      max-height: 85%;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
    }

    .app-name {
      padding: 0.8rem 0.6rem;
      text-align: center;
      font-weight: 600;
      font-size: 0.95rem;
      line-height: 1.3;
    }

    .download-now {
      display: block;
      width: 90%;
      margin: 0.6rem auto 1rem;
      padding: 0.8rem;
      background: linear-gradient(135deg, var(--gold), #b45309);
      color: white;
      font-weight: 700;
      text-align: center;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.95rem;
      box-shadow: var(--shadow-sm);
    }

    .download-now:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(217,119,6,0.4);
    }

    #detail-page {
      display: none;
      padding: 2rem 1.5rem;
      max-width: 680px;
      margin: 0 auto;
    }

    .detail-icon {
      width: 150px;
      height: 150px;
      margin: 0 auto 1.8rem;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-md), var(--glow);
    }

    .detail-name {
      font-family: 'Poppins';
      font-size: 2.4rem;
      text-align: center;
      margin-bottom: 0.8rem;
    }

    .detail-meta {
      text-align: center;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .detail-desc {
      background: var(--card);
      padding: 1.8rem;
      border-radius: var(--radius);
      line-height: 1.75;
      margin-bottom: 2rem;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .detail-download {
      display: block;
      width: 100%;
      max-width: 380px;
      margin: 0 auto 2rem;
      padding: 1.2rem;
      background: linear-gradient(135deg, var(--gold), #b45309);
      color: white;
      font-size: 1.3rem;
      font-weight: 700;
      text-align: center;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: var(--shadow-md);
    }

    .detail-download:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(217,119,6,0.35);
    }

    .upload-date {
      text-align: center;
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 2rem;
    }

    .feedback-section {
      background: var(--card);
      padding: 2rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      margin: 2.5rem 0;
      border: 1px solid rgba(94,53,177,0.1);
    }

    .feedback-section h3 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: var(--primary);
      font-size: 1.6rem;
    }

    .feedback-input, textarea {
      width: 100%;
      padding: 1.1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 1.3rem;
      font-size: 1rem;
      background: #f9fafb;
    }

    .submit-feedback {
      background: var(--primary);
      color: white;
      border: none;
      padding: 1.1rem 2.2rem;
      border-radius: 60px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: var(--shadow-sm);
      width: 100%;
      max-width: 300px;
      display: block;
      margin: 1.5rem auto;
    }

    .submit-feedback:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md), var(--glow);
    }

    .feedback-list {
      margin-top: 2rem;
    }

    .feedback-item {
      background: #f9fafb;
      padding: 1.2rem;
      border-radius: var(--radius);
      margin-bottom: 1rem;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .feedback-item p {
      margin: 0.5rem 0;
      font-size: 0.95rem;
    }

    .feedback-email {
      color: var(--muted);
      font-style: italic;
    }

    .form-group { margin-bottom: 1.5rem; }

    label { font-weight: 600; margin-bottom: 0.6rem; display: block; }

    input, textarea, select {
      width: 100%;
      padding: 1rem 1.3rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 1rem;
      background: var(--card);
    }

    .whatsapp-prefix {
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--card);
    }

    .prefix {
      background: #f3f4f6;
      padding: 1rem 1.2rem;
      color: var(--muted);
      font-weight: 500;
      border-right: 1px solid var(--border);
    }

    .whatsapp-input {
      flex: 1;
      border: none;
      outline: none;
      padding: 1rem;
      font-size: 1rem;
      background: transparent;
    }

    .submit-btn {
      width: 100%;
      padding: 1.1rem;
      background: var(--primary);
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }

    .submit-btn:hover {
      background: #4527a0;
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .msg {
      padding: 1.2rem;
      border-radius: var(--radius);
      margin: 1.2rem 0;
      text-align: center;
    }

    .success { background: rgba(16,185,129,0.2); color: #34d399; }
    .error { background: rgba(239,68,68,0.2); color: #f87171; }

    .complaint-id-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.8rem;
      text-align: center;
      margin: 2.5rem 0;
      box-shadow: var(--shadow-md);
    }

    .complaint-id {
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--primary);
      margin: 1.2rem 0;
    }

    .copy-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.9rem 1.8rem;
      border-radius: 999px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-circle">
      <img id="logo-img" src="https://ibb.co/4RqMPZBc" alt="Crazy DevStudio">
    </div>
    
    <!-- Brand names ko page ke andar jaise card style mein wrap kiya -->
    <div class="brand-container">
      <div class="brand-main">MrCrazy Digital Company</div>
      <div class="brand-sub">DevStudio</div>
    </div>
  </header>

  <!-- Landscapes banner ko chota + frame type banaya -->
  <div class="banner-frame">
    <img id="banner-img" src="https://ibb.co/4RqMPZBc" alt="Banner">
  </div>

  <!-- Buttons ko thora small + professional floppy (pill) style mein rakha -->
  <div class="main-buttons" id="home-buttons">
    <button class="main-btn my-apps-btn" onclick="showPage('apps')">My Apps</button>
    <button class="main-btn report-btn" onclick="showPage('report')">Report Problem</button>
  </div>

  <div id="apps-page">
    <button class="back-btn" onclick="showPage('home')">← Back to Home</button>
    <div class="grid" id="apps-grid"></div>
  </div>

  <div id="detail-page">
    <button class="back-btn" onclick="showPage('apps')">← Back to Apps</button>

    <div class="detail-icon">
      <img id="detail-icon" src="" alt="App Icon">
    </div>

    <h1 class="detail-name" id="detail-name"></h1>

    <div class="detail-meta">
      Size: <strong id="detail-size"></strong><br>
      Developer: <strong>MrCrazyTeam</strong>
    </div>

    <div class="detail-desc" id="detail-desc"></div>

    <a id="detail-download" class="detail-download" href="#" target="_blank">Download Now</a>

    <div class="upload-date" id="upload-date"></div>

    <div class="feedback-section">
      <h3 style="text-align:center; margin-bottom:1.5rem; color:var(--primary);">Feedback</h3>
      <input type="email" id="feedback-email" class="feedback-input" placeholder="Your Gmail/Email (optional)">
      <textarea class="feedback-input" id="feedback-text" rows="4" placeholder="Your feedback..."></textarea>
      <button class="submit-feedback" onclick="submitFeedback()">Submit Feedback</button>

      <div class="feedback-list" id="feedback-list"></div>
    </div>

    <div class="report-link" onclick="showPage('report')">Download Error? Report Here</div>
  </div>

  <div id="report-page">
    <button class="back-btn" onclick="showPage('home')">← Back to Home</button>

    <h2 style="text-align:center; margin-bottom:1.8rem; color:var(--primary);">Report a Problem</h2>

    <div id="report-msg" class="msg" style="display:none;"></div>

    <div class="form-group">
      <label>Select App</label>
      <select id="report-app">
        <option value="">Select App</option>
      </select>
    </div>

    <div class="form-group">
      <label>Username</label>
      <input id="report-username" type="text" placeholder="Your username">
    </div>

    <div class="form-group">
      <label>WhatsApp Number</label>
      <div class="whatsapp-prefix">
        <span class="prefix">+92</span>
        <input id="report-whatsapp" class="whatsapp-input" type="tel" placeholder="3XX XXXXXXX" maxlength="10">
      </div>
    </div>

    <div class="form-group">
      <label>Describe Your Problem *</label>
      <textarea id="report-desc" placeholder="e.g. App crash ho raha hai..." required></textarea>
    </div>

    <button class="submit-btn" onclick="submitReport()">Submit Report</button>

    <div id="complaint-id-box" class="complaint-id-box" style="display:none;">
      <h3>Your Complaint ID</h3>
      <div id="complaint-id" class="complaint-id"></div>
      <button class="copy-btn" onclick="copyComplaintID()">Copy ID</button>
      <p style="margin-top:1rem; color:var(--muted);">Yeh box 2 minutes baad gayab ho jayega</p>
    </div>
  </div>

  <script type="module">
    // Page switch
    window.showPage = (page) => {
      document.getElementById('home-buttons').style.display = page === 'home' ? 'flex' : 'none';
      document.getElementById('apps-page').style.display = page === 'apps' ? 'block' : 'none';
      document.getElementById('detail-page').style.display = page === 'detail' ? 'block' : 'none';
      document.getElementById('report-page').style.display = page === 'report' ? 'block' : 'none';
    };

    // Load Logo & Banner
    document.getElementById('logo-img').src = "https://ibb.co/4RqMPZBc";
    document.getElementById('banner-img').src = "https://ibb.co/4RqMPZBc";

    onValue(ref(window.db, 'logo'), (snap) => {
      const url = snap.val();
      if (url) document.getElementById('logo-img').src = url;
    });

    onValue(ref(window.db, 'banner'), (snap) => {
      const url = snap.val();
      if (url) document.getElementById('banner-img').src = url;
    });

    // Load Apps
    onValue(ref(window.db, 'apps'), (snap) => {
      const data = snap.val() || {};
      const grid = document.getElementById('apps-grid');
      const appSelect = document.getElementById('report-app');
      grid.innerHTML = '';

      appSelect.innerHTML = '<option value="">Select App</option>';

      if (Object.keys(data).length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--muted);padding:6rem 0;">No apps available yet.</p>';
        return;
      }

      Object.entries(data).forEach(([key, app]) => {
        const card = document.createElement('div');
        card.className = 'app-card';
        card.innerHTML = `
          <div class="app-icon">
            <img src="${app.icon || 'https://ibb.co/4RqMPZBc'}" alt="${app.name}">
          </div>
          <div class="app-name">${app.name}</div>
          <a class="download-now" href="#" onclick="openDetail('${key}'); return false;">Download Now</a>
        `;
        grid.appendChild(card);

        const option = document.createElement('option');
        option.value = app.name;
        option.textContent = app.name;
        appSelect.appendChild(option);
      });
    });

    // Open Detail Page
    window.openDetail = function(key) {
      onValue(ref(window.db, 'apps/' + key), (snap) => {
        const app = snap.val();
        if (!app) return;

        showPage('detail');

        document.getElementById('detail-name').textContent = app.name || 'App';
        document.getElementById('detail-icon').src = app.icon || 'https://ibb.co/4RqMPZBc';
        document.getElementById('detail-size').textContent = app.size || '~25 MB';

        document.getElementById('detail-desc').innerHTML = app.description 
          ? app.description.replace(/\n/g, '<br>') 
          : 'No description available.';

        const dateStr = app.timestamp 
          ? new Date(app.timestamp).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' })
          : 'N/A';
        document.getElementById('upload-date').textContent = `Uploaded: ${dateStr}`;

        document.getElementById('detail-download').href = app.download || '#';
      });
    };

    // Submit Report
    window.submitReport = function() {
      const appName = document.getElementById('report-app').value;
      const username = document.getElementById('report-username').value.trim();
      const whatsapp = document.getElementById('report-whatsapp').value.trim();
      const desc = document.getElementById('report-desc').value.trim();

      if (!desc || !appName) {
        document.getElementById('report-msg').textContent = 'App Name aur Problem description zaroori hain';
        document.getElementById('report-msg').style.background = '#fee2e2';
        document.getElementById('report-msg').style.color = '#991b1b';
        document.getElementById('report-msg').style.display = 'block';
        return;
      }

      const newRef = push(ref(window.db, 'complaints'));
      const id = 'Crazy-' + newRef.key.substring(0,8);

      set(newRef, {
        complaintId: id,
        appName,
        username: username || 'Anonymous',
        whatsapp: whatsapp ? '+92' + whatsapp : 'N/A',
        description: desc,
        date: new Date().toLocaleString('en-GB')
      }).then(() => {
        document.getElementById('complaint-id').textContent = id;
        document.getElementById('complaint-id-box').style.display = 'block';

        setTimeout(() => {
          document.getElementById('complaint-id-box').style.display = 'none';
        }, 120000);

        document.getElementById('report-msg').textContent = 'Report submit ho gaya! ID copy kar lo';
        document.getElementById('report-msg').style.background = '#d1fae5';
        document.getElementById('report-msg').style.color = '#065f46';
        document.getElementById('report-msg').style.display = 'block';

        document.getElementById('report-username').value = '';
        document.getElementById('report-whatsapp').value = '';
        document.getElementById('report-desc').value = '';
        document.getElementById('report-app').value = '';
      });
    };

    window.copyComplaintID = function() {
      const id = document.getElementById('complaint-id').textContent;
      navigator.clipboard.writeText(id).then(() => alert('ID copied!'));
    };

    // Feedback Submit
    window.submitFeedback = function() {
      const email = document.getElementById('feedback-email').value.trim();
      const text = document.getElementById('feedback-text').value.trim();

      if (!text) {
        alert('Feedback likhna zaroori hai');
        return;
      }

      const appName = document.getElementById('detail-name').textContent;

      push(ref(window.db, 'feedback/' + appName), {
        feedback: text,
        email: email || 'Anonymous',
        timestamp: Date.now(),
        date: new Date().toLocaleString('en-GB')
      }).then(() => {
        alert('Feedback submit ho gaya!');
        document.getElementById('feedback-email').value = '';
        document.getElementById('feedback-text').value = '';
        loadFeedback(appName);
      });
    };

    function loadFeedback(appName) {
      onValue(ref(window.db, 'feedback/' + appName), (snap) => {
        const data = snap.val() || {};
        const list = document.getElementById('feedback-list');
        list.innerHTML = '';

        if (Object.keys(data).length === 0) {
          document.getElementById('avg-rating').textContent = 'No feedback yet';
          return;
        }

        Object.values(data).forEach(f => {
          const item = document.createElement('div');
          item.className = 'feedback-item';
          item.innerHTML = `
            <p><strong>${f.email.replace(/(.)(.*)(@.*)/, '$1***$3')}</strong></p>
            <p>${f.feedback}</p>
            <p style="color:var(--muted); font-size:0.9rem;">${f.date}</p>
          `;
          list.appendChild(item);
        });

        document.getElementById('avg-rating').textContent = `Total Feedback: ${Object.keys(data).length}`;
      });
    };

    // Start
    document.getElementById('home-buttons').style.display = 'flex';
  </script>
</body>
</html>
